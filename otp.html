<form id="otp-form">
    <label for="otp">กรอกรหัส OTP:</label>
    <input type="text" id="otp" maxlength="6" required>
    <button type="submit">ยืนยัน OTP</button>
</form>
<p id="otp-error" style="color:red"></p>

<script>
document.getElementById("otp-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const otpError = document.getElementById("otp-error");
    otpError.textContent = "";

    const otp = document.getElementById("otp").value.trim();

    try {
        const res = await fetch("/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ otp })
        });

        const data = await res.json();
        if (data.success) {
            alert("ยืนยัน OTP สำเร็จ!");
            window.location.href = "/login.html";
        } else {
            otpError.textContent = data.message;
        }
    } catch (err) {
        otpError.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        console.error(err);
    }
});
</script>
