<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - เว็บไซต์สอนเขียนโปรแกรม</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body data-sidebar="/components/empty.html" class="login-page">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div> 

    <!-- Content -->
    <main id="main-content">
        <h1>เข้าสู่ระบบ</h1>
        <form id="login-form">
            <label for="username">ชื่อผู้ใช้</label><br>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">รหัสผ่าน</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <p id="login-error" style="color: red; display: none;">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

</body>
</html>
