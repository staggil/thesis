<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - เว็บไซต์สอนเขียนโปรแกรม</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-sidebar="" class="login-page">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="layout">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div> 

    <!-- Content -->
    <main id="main-content">
        <h1>เข้าสู่ระบบ</h1>
        <form id="login-form">
            <label for="username">ชื่อผู้ใช้ หรือ อีเมล</label><br>
            <input type="text" id="username" name="username" placeholder="Username หรือ Email" required><br><br>


            <label for="password">รหัสผ่าน</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <p id="login-error" style="color: red; display: none;"></p>
        <p>หากไม่มีบัญชี <a href="register.html">สมัครสมาชิก</a></p>
    </main>
</div>
    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            const err = document.getElementById("login-error");
            err.style.display = "block";
            err.textContent = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
            return;
        }

        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            const err = document.getElementById("login-error");
            if (data.success) {
                err.style.display = "none";
                alert(data.message);
                window.location.href = "/"; // redirect ไปหน้า index
            } else {
                err.style.display = "block";
                err.textContent = data.message;
            }
        } catch (error) {
            console.error("Error:", error);
            const err = document.getElementById("login-error");
            err.style.display = "block";
            err.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        }
    });
    </script>

</body>
</html>
