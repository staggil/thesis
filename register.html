<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - เว็บไซต์สอนเขียนโปรแกรม</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-sidebar="/components/empty.html" class="register-page">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div> 

    <!-- Content -->
    <main id="main-content">
        <h1>สมัครสมาชิก</h1>
        <form id="register-form" action="register.php" method="POST">
            <label for="username">ชื่อผู้ใช้</label><br>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">รหัสผ่าน</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="fullname">ชื่อ-นามสกุล</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <button type="submit">สมัครสมาชิก</button>
        </form>
        <p>หากมีบัญชีแล้ว <a href="login.html">เข้าสู่ระบบ</a></p>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

</body>
</html>
