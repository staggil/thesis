<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - เว็บไซต์สอนเขียนโปรแกรม</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-sidebar="components/empty.html" class="register-page">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div> 

    <!-- Content -->
    <main id="main-content">
        <h1>สมัครสมาชิก</h1>
        <form id="register-form">
            <label for="username">ชื่อผู้ใช้</label><br>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">รหัสผ่าน</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="fullname">ชื่อ-นามสกุล</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <button type="submit">สมัครสมาชิก</button>
        </form>
        <p id="register-error" style="color:red; display:none;"></p>
        <p>หากมีบัญชีแล้ว <a href="login.html">เข้าสู่ระบบ</a></p>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const fullname = document.getElementById("fullname").value.trim();

        if (!username || !password || !fullname) {
            const err = document.getElementById("register-error");
            err.style.display = "block";
            err.textContent = "กรุณากรอกข้อมูลให้ครบทุกช่อง";
            return;
        }

        try {
            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, fullname })
            });

            const data = await res.json();

            const err = document.getElementById("register-error");
            if (data.success) {
                err.style.display = "none";
                alert(data.message);
                window.location.href = "/login.html"; // redirect ไปหน้า login
            } else {
                err.style.display = "block";
                err.textContent = data.message;
            }

        } catch (error) {
            console.error("Error:", error);
            const err = document.getElementById("register-error");
            err.style.display = "block";
            err.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        }
    });
    </script>

</body>
</html>
